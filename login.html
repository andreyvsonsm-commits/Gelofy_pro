<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20140D">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="gelofy.png">
  <title>Gelofy | Painel administrativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --cream:#F8F1E7;--cream-2:#EFE1C8;--paper:#FFFDF9;
      --espresso:#20140D;--espresso-2:#3A2416;--caramel:#A8622A;--caramel-dark:#7A4318;--caramel-light:#E3AD6E;
      --ink:#241708;--muted:#786353;--line:rgba(32,20,13,.12);--danger:#E08674;
      --ease:cubic-bezier(.22,1,.36,1);
      --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --display:"Instrument Serif",Georgia,serif;
      --mono:"Space Grotesk",var(--font);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      font-family:var(--font);color:#F6EEE3;
      background:radial-gradient(120% 120% at 20% 0%,#4A2A15 0%,var(--espresso-2) 45%,var(--espresso) 100%);
      position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
    .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
    .blob-1{width:380px;height:380px;background:var(--caramel);top:-120px;left:-80px}
    .blob-2{width:320px;height:320px;background:var(--caramel-light);bottom:-100px;right:-60px;opacity:.22}
    .blob-3{width:260px;height:260px;background:#8A4A22;top:40%;right:10%;opacity:.18}

    .card{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}

    .avatar-ring{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--caramel-light),var(--caramel-dark));padding:4px;box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08)}
    .avatar{width:100%;height:100%;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .avatar img{width:62%;height:62%;object-fit:contain}

    .brand-caption{margin-top:18px;font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--caramel-light)}
    h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:2rem;margin:6px 0 34px;color:#F6EEE3}

    form{width:100%;display:flex;flex-direction:column;gap:26px}
    .field{position:relative;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(246,238,227,.28);padding-bottom:10px;transition:border-color .25s var(--ease)}
    .field:focus-within{border-color:var(--caramel-light)}
    .field svg{width:18px;height:18px;color:#C4B39E;flex-shrink:0}
    .field input{flex:1;background:transparent;border:0;outline:0;color:#F6EEE3;font-size:1rem;font-family:var(--font)}
    .field input::placeholder{color:#C4B39E}
    .field input:-webkit-autofill{-webkit-text-fill-color:#F6EEE3;transition:background-color 9999s ease-in-out 0s}

    .actions{margin-top:8px;display:flex;flex-direction:column;gap:12px}
    .btn-login{min-height:52px;border:0;border-radius:14px;background:linear-gradient(120deg,var(--caramel-light),var(--caramel));color:#20140D;font-weight:700;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 34px rgba(0,0,0,.3);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 20px 42px rgba(0,0,0,.36)}
    .btn-login:active{transform:translateY(0)}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-login:focus-visible{outline:3px solid var(--caramel-light);outline-offset:3px}

    .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(32,20,13,.25);border-top-color:#20140D;animation:spin .7s linear infinite;display:none}
    .is-loading .spinner{display:inline-block}
    .is-loading .btn-label{opacity:.85}
    @keyframes spin{to{transform:rotate(360deg)}}

    .error-message{display:none;margin-top:2px;color:var(--danger);font-size:.82rem;font-weight:600}
    .error-message.show{display:block}

    .config-warning{position:relative;z-index:1;margin-top:22px;max-width:380px;background:rgba(224,134,116,.14);border:1px solid rgba(224,134,116,.4);color:#F3D8D0;font-size:.78rem;padding:12px 14px;border-radius:12px;display:none;text-align:left;line-height:1.5}
    .config-warning.show{display:block}
    .config-warning code{font-family:var(--mono);background:rgba(0,0,0,.2);padding:1px 5px;border-radius:5px}

    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>

  <div class="card">
    <div class="avatar-ring"><div class="avatar"><img src="gelofy.png" alt="Gelofy"></div></div>
    <span class="brand-caption">Gelofy</span>
    <h1>Painel administrativo</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/><path d="m3.5 6 8.5 6.5L20.5 6"/></svg>
        <input id="email" type="email" autocomplete="username" placeholder="E-mail" required aria-label="E-mail">
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" autocomplete="current-password" placeholder="Senha" required aria-label="Senha">
      </div>

      <p class="error-message" id="errorMessage" role="alert"></p>

      <div class="actions">
        <button class="btn-login" type="submit" id="loginBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Entrar</span>
        </button>
      </div>
    </form>
  </div>

  <p class="config-warning" id="configWarning">
    Este login ainda não está conectado ao Supabase. Abra <code>supabase-config.js</code> e cole a
    <strong>Project URL</strong> e a <strong>anon public key</strong> do seu projeto (veja a Etapa 2 do guia de setup).
  </p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    (() => {
      "use strict";
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const errorMessage = document.getElementById("errorMessage");
      const configWarning = document.getElementById("configWarning");

      const isConfigured =
        window.SUPABASE_URL && !window.SUPABASE_URL.includes("COLE_AQUI") &&
        window.SUPABASE_ANON_KEY && !window.SUPABASE_ANON_KEY.includes("COLE_AQUI");

      if (!isConfigured) {
        configWarning.classList.add("show");
      }

      const supabase = isConfigured
        ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
        : null;

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
      }
      function clearError() {
        errorMessage.textContent = "";
        errorMessage.classList.remove("show");
      }
      function setLoading(isLoading) {
        loginBtn.disabled = isLoading;
        loginBtn.classList.toggle("is-loading", isLoading);
      }

      // Se já existe uma sessão válida, pula direto para o painel.
      async function checkExistingSession() {
        if (!supabase) return;
        const { data } = await supabase.auth.getSession();
        if (data?.session) window.location.href = "admin.html";
      }
      checkExistingSession();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError();

        if (!supabase) {
          showError("Configure o supabase-config.js antes de fazer login.");
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          showError("Preencha e-mail e senha.");
          return;
        }

        setLoading(true);
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        setLoading(false);

        if (error) {
          showError("E-mail ou senha incorretos.");
          return;
        }

        window.location.href = "admin.html";
      });
    })();
  </script>
</body>
</html>
